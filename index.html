<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍄 瑪利歐數學大冒險</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
    touch-action: manipulation;
  }
  body {
    background: #0f172a;
    color: #ffffff;
    font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game-app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 800px;
    position: relative;
    display: flex;
    flex-direction: column;
    background: #5c94fc;
    border: 6px solid #000000;
    box-shadow: 0 10px 0 #000000;
    overflow: hidden;
    transition: background 0.5s ease;
  }

  /* Boss 關卡背景切換為地下城堡暗色系 */
  #game-app.boss-theme {
    background: #1e1b4b;
  }

  .screen-shake {
    animation: shakeEffect 0.22s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shakeEffect {
    10%, 90% { transform: translate3d(-3px, 2px, 0); }
    20%, 80% { transform: translate3d(4px, -3px, 0); }
    30%, 50%, 70% { transform: translate3d(-5px, 4px, 0); }
    40%, 60% { transform: translate3d(5px, -4px, 0); }
  }

  #header {
    background: rgba(0, 0, 0, 0.85);
    padding: 10px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    z-index: 30;
    border-bottom: 3px solid #000;
  }

  .btn-top {
    background: #f59e0b;
    border: 2px solid #ffffff;
    color: #000;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 8px;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-top:active { transform: translateY(2px); }

  #timer-bar-wrap {
    width: 100%;
    height: 8px;
    background: #1e293b;
    z-index: 29;
    border-bottom: 2px solid #000;
  }
  #timer-bar {
    width: 100%;
    height: 100%;
    background: #22c55e;
    transition: width 0.1s linear, background-color 0.3s;
  }

  #battle-stage {
    flex: 1;
    position: relative;
    width: 100%;
    overflow: hidden;
  }

  .clouds-layer {
    position: absolute;
    top: 15px;
    left: 0;
    width: 200%;
    height: 45px;
    background: radial-gradient(circle 14px at 20px 20px, #ffffff 100%, transparent 0),
                radial-gradient(circle 20px at 45px 16px, #ffffff 100%, transparent 0),
                radial-gradient(circle 14px at 70px 20px, #ffffff 100%, transparent 0);
    background-size: 240px 45px;
    opacity: 0.85;
    animation: cloudMove 25s linear infinite;
    z-index: 1;
    transition: opacity 0.5s;
  }
  .boss-theme .clouds-layer {
    opacity: 0.2;
  }
  @keyframes cloudMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .hills-layer {
    position: absolute;
    bottom: 38px;
    width: 100%;
    height: 100px;
    z-index: 2;
    pointer-events: none;
  }

  .question-block {
    position: absolute;
    top: 12px;
    left: 4%;
    width: 92%;
    background: #fcb040;
    border: 4px solid #000000;
    box-shadow: inset -4px -4px 0 #8c4000, inset 4px 4px 0 #ffe0a0, 0 5px 0 rgba(0,0,0,0.3);
    border-radius: 14px;
    text-align: center;
    padding: 14px 10px;
    animation: floatBlock 2.2s infinite ease-in-out;
    z-index: 25;
  }
  .boss-theme .question-block {
    background: #ea580c;
    box-shadow: inset -4px -4px 0 #7c2d12, inset 4px 4px 0 #fdba74, 0 5px 0 rgba(0,0,0,0.5);
  }
  @keyframes floatBlock {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .q-math {
    font-size: 34px;
    font-weight: 700;
    color: #1e1b4b;
    letter-spacing: 2px;
  }
  .boss-theme .q-math {
    color: #ffffff;
  }

  #status-indicator {
    position: absolute;
    top: 88px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 8px;
    z-index: 26;
  }
  .status-badge {
    background: rgba(0, 0, 0, 0.75);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    border: 1.5px solid #ffd700;
  }

  #boss-hp-wrap {
    position: absolute;
    top: 115px;
    right: 25px;
    display: none;
    flex-direction: column;
    align-items: flex-end;
    z-index: 26;
  }
  .boss-label { font-size: 11px; color: #ef4444; font-weight: 700; margin-bottom: 2px; text-shadow: 1px 1px #000; }
  .boss-hearts { font-size: 14px; }

  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 38px;
    background: repeating-linear-gradient(45deg, #c84c0c, #c84c0c 12px, #000 12px, #000 14px, #fc9838 14px, #fc9838 24px);
    border-top: 4px solid #000;
    z-index: 10;
  }
  .boss-theme .ground {
    background: repeating-linear-gradient(45deg, #475569, #475569 12px, #000 12px, #000 14px, #94a3b8 14px, #94a3b8 24px);
  }

  .pipe {
    position: absolute;
    right: 28px;
    bottom: 38px;
    width: 86px;
    height: 60px;
    background: #00a800;
    border: 4px solid #000;
    box-shadow: inset 6px 0 0 #54f054, inset -6px 0 0 #005400;
    z-index: 9;
  }
  .pipe::before {
    content: '';
    position: absolute;
    top: -16px;
    left: -5px;
    width: 88px;
    height: 16px;
    background: #00a800;
    border: 4px solid #000;
    box-shadow: inset 6px 0 0 #54f054, inset -6px 0 0 #005400;
  }
  .boss-theme .pipe {
    background: #334155;
    box-shadow: inset 6px 0 0 #64748b, inset -6px 0 0 #0f172a;
  }
  .boss-theme .pipe::before {
    background: #334155;
    box-shadow: inset 6px 0 0 #64748b, inset -6px 0 0 #0f172a;
  }

  #player-box {
    position: absolute;
    left: 28px;
    bottom: 38px;
    width: 76px;
    height: 90px;
    z-index: 15;
    transform-origin: bottom center;
  }

  #enemy-box {
    position: absolute;
    right: 37px;
    bottom: 98px;
    width: 68px;
    height: 68px;
    z-index: 8;
    transform-origin: bottom center;
  }

  .idle-anim {
    animation: idleBreathe 1.1s infinite ease-in-out alternate;
  }
  @keyframes idleBreathe {
    0% { transform: scale(1, 1); }
    100% { transform: scale(1.02, 0.96); }
  }

  .enemy-emerge-anim {
    animation: pipeEmerge 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.15) forwards;
  }
  @keyframes pipeEmerge {
    0% { transform: translateY(65px); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .player-stomp-anim {
    animation: dynamicJumpStomp 0.88s cubic-bezier(0.22, 0.61, 0.36, 1) forwards !important;
  }
  @keyframes dynamicJumpStomp {
    0% { transform: translate3d(0, 0, 0) scale(1, 1); }
    15% { transform: translate3d(0, 8px, 0) scale(1.1, 0.85); }
    45% { transform: translate3d(140px, -145px, 0) rotate(-12deg) scale(0.95, 1.08); }
    62% { transform: translate3d(245px, -60px, 0) rotate(0deg) scale(1.15, 0.8); }
    72% { transform: translate3d(225px, -110px, 0) rotate(15deg) scale(0.95, 1.05); }
    90% { transform: translate3d(40px, -20px, 0) rotate(5deg) scale(1, 1); }
    97% { transform: translate3d(0, 4px, 0) scale(1.08, 0.92); }
    100% { transform: translate3d(0, 0, 0) scale(1, 1); }
  }

  .enemy-squished {
    animation: squishAnim 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
  }
  @keyframes squishAnim {
    0% { transform: scale(1, 1) translateY(0); }
    30% { transform: scale(1.4, 0.18) translateY(20px); opacity: 1; }
    60% { transform: scale(1.5, 0.1) translateY(35px); opacity: 0.8; }
    100% { transform: scale(1.5, 0.05) translateY(65px); opacity: 0; }
  }

  .hit-spark {
    position: absolute;
    right: 42px;
    bottom: 105px;
    width: 65px;
    height: 65px;
    pointer-events: none;
    z-index: 28;
    animation: hitPop 0.32s ease-out forwards;
  }
  @keyframes hitPop {
    0% { transform: scale(0.2) rotate(0deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(45deg); opacity: 0; }
  }

  #options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 12px 14px 18px;
    background: #000000;
    width: 100%;
    border-top: 4px solid #ffffff;
    z-index: 20;
  }

  .btn-option {
    background: #e52521;
    border: 4px solid #ffffff;
    box-shadow: inset -4px -4px 0 #800000, inset 4px 4px 0 #ff9999, 0 4px 0 #000;
    color: #ffffff;
    font-family: inherit;
    font-size: 34px;
    font-weight: 700;
    padding: 16px 0;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
  }
  .btn-option:active { transform: translateY(3px); box-shadow: none; }

  .coin-fx {
    position: absolute;
    font-size: 24px;
    color: #ffd700;
    text-shadow: 2px 2px #000;
    font-weight: 700;
    pointer-events: none;
    z-index: 30;
    animation: coinPop 0.65s ease-out forwards;
  }
  @keyframes coinPop {
    0% { transform: translate3d(0, 0, 0) scale(0.6); opacity: 1; }
    100% { transform: translate3d(0, -50px, 0) scale(1.25); opacity: 0; }
  }

  .modal-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.96);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px 20px;
    z-index: 50;
    text-align: center;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: #fde047; margin-bottom: 10px; text-shadow: 2px 2px #c2410c; }
  .modal-desc { font-size: 12px; color: #94a3b8; margin-bottom: 12px; font-weight: 700; }

  .mode-group-title {
    width: 100%;
    font-size: 12px;
    color: #38bdf8;
    text-align: left;
    margin: 6px 0 4px;
    font-weight: 700;
  }

  .mode-btn {
    width: 100%;
    background: #0284c7;
    border: 2px solid #ffffff;
    box-shadow: inset -2px -2px 0 #0369a1, inset 2px 2px 0 #38bdf8, 0 3px 0 #000;
    color: #ffffff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    text-align: center;
  }
  .mode-btn:active { transform: translateY(2px); box-shadow: none; }
  .mode-btn.mul {
    background: #059669;
    box-shadow: inset -2px -2px 0 #047857, inset 2px 2px 0 #34d399, 0 3px 0 #000;
  }

  .shop-item-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e293b;
    border: 2px solid #334155;
    padding: 8px 10px;
    margin-bottom: 8px;
    border-radius: 8px;
  }
  .shop-item-info { text-align: left; font-size: 11px; font-weight: 700; }
  .shop-item-info small { color: #94a3b8; font-size: 9px; display: block; margin-top: 2px; }
  .shop-buy-btn {
    background: #f59e0b;
    border: 2px solid #fff;
    font-family: inherit;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: #000;
    font-weight: 700;
  }
  .shop-buy-btn:disabled { background: #64748b; color: #cbd5e1; cursor: not-allowed; }

  .lb-table { width: 100%; font-size: 12px; font-weight: 700; margin-bottom: 14px; border-collapse: collapse; }
  .lb-table th { color: #38bdf8; padding: 6px 4px; border-bottom: 2px solid #334155; }
  .lb-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #1e293b; }
</style>
</head>
<body>

<div id="game-app">
  <div id="header">
    <div>🪙 <span id="coin-total">0</span></div>
    <div>RD <span id="round-count">1</span>/10</div>
    <div><span id="lives-display">❤️❤️❤️</span></div>
    <button class="btn-top" onclick="openShop()">🏪 商店</button>
    <button class="btn-top" id="bgm-toggle-btn" onclick="toggleBGM()">🎵 ON</button>
    <button class="btn-top" onclick="showDifficultyMenu()">⚙️ 難度</button>
    <button class="btn-top" onclick="openLeaderboard()">🏆 榜</button>
  </div>

  <div id="timer-bar-wrap">
    <div id="timer-bar"></div>
  </div>

  <div id="battle-stage">
    <div class="clouds-layer"></div>
    <div class="hills-layer">
      <svg width="100%" height="100%" viewBox="0 0 400 100" preserveAspectRatio="none">
        <ellipse cx="60" cy="100" rx="90" ry="60" fill="#008800" stroke="#000" stroke-width="3"/>
        <ellipse cx="280" cy="100" rx="120" ry="70" fill="#00a800" stroke="#000" stroke-width="3"/>
        <ellipse cx="160" cy="100" rx="35" ry="25" fill="#54f054" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="370" cy="100" rx="40" ry="28" fill="#54f054" stroke="#000" stroke-width="2.5"/>
      </svg>
    </div>

    <div class="question-block">
      <div class="q-math" id="q-text">-- + -- = ?</div>
    </div>

    <div id="status-indicator"></div>

    <div id="boss-hp-wrap">
      <span class="boss-label">🔥 庫巴魔王 HP</span>
      <span class="boss-hearts" id="boss-hearts">❤️❤️❤️</span>
    </div>

    <div class="sprite-box idle-anim" id="player-box"></div>
    <div class="sprite-box" id="enemy-box"></div>

    <div class="pipe"></div>
    <div class="ground"></div>
  </div>

  <div id="options-grid">
    <button class="btn-option" onclick="handleChoice(0)" id="opt-0">-</button>
    <button class="btn-option" onclick="handleChoice(1)" id="opt-1">-</button>
    <button class="btn-option" onclick="handleChoice(2)" id="opt-2">-</button>
    <button class="btn-option" onclick="handleChoice(3)" id="opt-3">-</button>
  </div>

  <!-- 難度選單 -->
  <div id="modal-box" class="modal-screen">
    <h1 class="modal-title">SUPER MARIO<br>MATH BATTLE</h1>
    <p class="modal-desc">請選擇訓練等級：</p>
    
    <div class="mode-group-title">➕ ➖ 加減法冒險</div>
    <button class="mode-btn" onclick="startBattle('10')">🍄 10 以內加減法</button>
    <button class="mode-btn" onclick="startBattle('100')">⭐ 100 以內加減法</button>
    <button class="mode-btn" onclick="startBattle('1000')">👑 1000 以內直式挑戰</button>
    
    <div class="mode-group-title">✖️ 九九乘法表冒險</div>
    <button class="mode-btn mul" onclick="startBattle('mul_2_5')">🌸 2 ~ 5 乘法表</button>
    <button class="mode-btn mul" onclick="startBattle('mul_5_6')">⚡ 5 ~ 6 乘法表</button>
    <button class="mode-btn mul" onclick="startBattle('mul_2_9')">🔥 2 ~ 9 乘法全階段</button>
  </div>

  <!-- 道具商城 -->
  <div id="shop-modal" class="modal-screen" style="display:none;">
    <h1 class="modal-title">🏪 奇諾比奧道具屋</h1>
    <p class="modal-desc">持有金幣：🪙 <span id="shop-coin-display">0</span></p>
    
    <div class="shop-item-row">
      <div class="shop-item-info">🍄 超級蘑菇 (30 幣)<small>免死金牌：抵擋 1 次答錯扣血</small></div>
      <button class="shop-buy-btn" onclick="buyItem('shield', 30)">購買</button>
    </div>
    <div class="shop-item-row">
      <div class="shop-item-info">⭐ 無敵星星 (50 幣)<small>下一題獲得 3 倍金幣獎勵</small></div>
      <button class="shop-buy-btn" onclick="buyItem('star', 50)">購買</button>
    </div>
    <div class="shop-item-row">
      <div class="shop-item-info">⏰ 停頓時鐘 (20 幣)<small>額外增加 5 秒作答時間</small></div>
      <button class="shop-buy-btn" onclick="buyItem('clock', 20)">購買</button>
    </div>
    <div class="shop-item-row">
      <div class="shop-item-info">🎽 路易吉造型 (100 幣)<small>解鎖 路易吉 專屬角色外觀</small></div>
      <button class="shop-buy-btn" id="btn-skin-unlock" onclick="buySkin(100)">解鎖造型</button>
    </div>

    <button class="mode-btn" style="background:#dc2626; margin-top:8px;" onclick="closeShop()">離開商店</button>
  </div>

  <!-- 排行榜視窗 -->
  <div id="lb-modal" class="modal-screen" style="display:none;">
    <h1 class="modal-title">🏆 TOP 10 冒險英雄榜</h1>
    <table class="lb-table">
      <thead><tr><th>#</th><th>闖關模式</th><th>累積金幣</th><th>狀態</th></tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
    <button class="mode-btn" style="background:#dc2626;" onclick="closeLeaderboard()">關閉</button>
  </div>
</div>

<script>
  const SVGS = {
    mario: `
      <svg viewBox="0 0 100 120" width="76" height="90">
        <ellipse cx="50" cy="22" rx="32" ry="16" fill="#e52521" stroke="#000" stroke-width="3"/>
        <path d="M 18 28 Q 50 14 82 28 Q 50 38 18 28" fill="#e52521" stroke="#000" stroke-width="3"/>
        <ellipse cx="50" cy="18" rx="9" ry="7" fill="#ffffff" stroke="#000" stroke-width="2"/>
        <circle cx="22" cy="48" r="7" fill="#fed7aa" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="50" cy="50" rx="26" ry="20" fill="#fed7aa" stroke="#000" stroke-width="3"/>
        <ellipse cx="60" cy="42" rx="4.5" ry="8" fill="#000"/>
        <ellipse cx="66" cy="48" rx="12" ry="9" fill="#fed7aa" stroke="#000" stroke-width="3"/>
        <path d="M 32 54 C 42 46 64 48 76 56 C 68 64 46 63 32 54 Z" fill="#451a03" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="50" cy="84" rx="24" ry="20" fill="#e52521" stroke="#000" stroke-width="3"/>
        <path d="M 30 78 L 70 78 L 66 106 L 34 106 Z" fill="#0284c7" stroke="#000" stroke-width="3"/>
        <circle cx="38" cy="84" r="4.5" fill="#facc15" stroke="#000" stroke-width="2"/>
        <circle cx="62" cy="84" r="4.5" fill="#facc15" stroke="#000" stroke-width="2"/>
        <ellipse cx="36" cy="110" rx="14" ry="8" fill="#78350f" stroke="#000" stroke-width="3"/>
        <ellipse cx="64" cy="110" rx="14" ry="8" fill="#78350f" stroke="#000" stroke-width="3"/>
      </svg>
    `,
    luigi: `
      <svg viewBox="0 0 100 120" width="76" height="92">
        <ellipse cx="50" cy="20" rx="30" ry="16" fill="#16a34a" stroke="#000" stroke-width="3"/>
        <path d="M 20 26 Q 50 12 80 26 Q 50 36 20 26" fill="#16a34a" stroke="#000" stroke-width="3"/>
        <ellipse cx="50" cy="16" rx="9" ry="7" fill="#ffffff" stroke="#000" stroke-width="2"/>
        <ellipse cx="50" cy="48" rx="23" ry="22" fill="#fed7aa" stroke="#000" stroke-width="3"/>
        <ellipse cx="60" cy="40" rx="4.5" ry="8" fill="#000"/>
        <ellipse cx="66" cy="46" rx="12" ry="9" fill="#fed7aa" stroke="#000" stroke-width="3"/>
        <path d="M 32 54 C 42 46 64 48 76 56 C 68 64 46 63 32 54 Z" fill="#451a03" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="50" cy="84" rx="24" ry="22" fill="#16a34a" stroke="#000" stroke-width="3"/>
        <path d="M 30 78 L 70 78 L 66 108 L 34 108 Z" fill="#1e3a8a" stroke="#000" stroke-width="3"/>
        <circle cx="38" cy="84" r="4.5" fill="#facc15" stroke="#000" stroke-width="2"/>
        <circle cx="62" cy="84" r="4.5" fill="#facc15" stroke="#000" stroke-width="2"/>
        <ellipse cx="36" cy="112" rx="14" ry="8" fill="#78350f" stroke="#000" stroke-width="3"/>
        <ellipse cx="64" cy="112" rx="14" ry="8" fill="#78350f" stroke="#000" stroke-width="3"/>
      </svg>
    `,
    goomba: `
      <svg viewBox="0 0 100 100" width="68" height="68">
        <path d="M 50 15 C 20 15 12 55 22 68 C 30 78 70 78 78 68 C 88 55 80 15 50 15" fill="#9a3412" stroke="#000" stroke-width="3"/>
        <ellipse cx="38" cy="46" rx="5" ry="10" fill="#fff" stroke="#000" stroke-width="2"/>
        <ellipse cx="62" cy="46" rx="5" ry="10" fill="#fff" stroke="#000" stroke-width="2"/>
        <circle cx="40" cy="48" r="3" fill="#000"/>
        <circle cx="60" cy="48" r="3" fill="#000"/>
        <path d="M 32 34 L 46 40 M 68 34 L 54 40" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
        <polygon points="34,68 38,60 42,68" fill="#fff"/>
        <polygon points="58,68 62,60 66,68" fill="#fff"/>
        <ellipse cx="32" cy="80" rx="14" ry="8" fill="#000"/>
        <ellipse cx="68" cy="80" rx="14" ry="8" fill="#000"/>
      </svg>
    `,
    koopa: `
      <svg viewBox="0 0 100 100" width="68" height="72">
        <ellipse cx="45" cy="55" rx="28" ry="24" fill="#16a34a" stroke="#000" stroke-width="3"/>
        <ellipse cx="45" cy="55" rx="20" ry="16" fill="#facc15" stroke="#000" stroke-width="2"/>
        <ellipse cx="65" cy="35" rx="16" ry="14" fill="#facc15" stroke="#000" stroke-width="3"/>
        <circle cx="70" cy="32" r="4" fill="#000"/>
        <ellipse cx="30" cy="80" rx="12" ry="7" fill="#f97316" stroke="#000" stroke-width="2"/>
        <ellipse cx="60" cy="80" rx="12" ry="7" fill="#f97316" stroke="#000" stroke-width="2"/>
      </svg>
    `,
    piranha: `
      <svg viewBox="0 0 100 100" width="68" height="72">
        <circle cx="50" cy="38" r="26" fill="#dc2626" stroke="#000" stroke-width="3"/>
        <circle cx="40" cy="28" r="5" fill="#fff"/>
        <circle cx="62" cy="45" r="4" fill="#fff"/>
        <polygon points="30,38 70,38 50,55" fill="#fff" stroke="#000" stroke-width="2"/>
        <path d="M 50 64 L 50 85" stroke="#16a34a" stroke-width="8"/>
        <ellipse cx="35" cy="75" rx="12" ry="6" fill="#16a34a" stroke="#000" stroke-width="2"/>
      </svg>
    `,
    bowser: `
      <svg viewBox="0 0 120 120" width="84" height="84">
        <ellipse cx="60" cy="65" rx="42" ry="36" fill="#15803d" stroke="#000" stroke-width="4"/>
        <polygon points="40,35 30,15 50,30" fill="#facc15" stroke="#000" stroke-width="3"/>
        <polygon points="80,35 90,15 70,30" fill="#facc15" stroke="#000" stroke-width="3"/>
        <ellipse cx="60" cy="55" rx="28" ry="24" fill="#f59e0b" stroke="#000" stroke-width="3"/>
        <ellipse cx="50" cy="48" rx="6" ry="8" fill="#ef4444" stroke="#000" stroke-width="2"/>
        <ellipse cx="70" cy="48" rx="6" ry="8" fill="#ef4444" stroke="#000" stroke-width="2"/>
        <path d="M 40 68 Q 60 85 80 68" fill="#fff" stroke="#000" stroke-width="3"/>
        <polygon points="48,68 52,78 56,68" fill="#fff"/>
        <polygon points="64,68 68,78 72,68" fill="#fff"/>
      </svg>
    `,
    spark: `
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <polygon points="50,0 60,35 95,50 60,65 50,100 40,65 5,50 40,35" fill="#fde047" stroke="#ffffff" stroke-width="4"/>
      </svg>
    `
  };

  /* ================= 狀態管理與系統變數 ================= */
  let totalCoins = parseInt(localStorage.getItem('mario_total_coins') || '0', 10);
  let unlockedSkins = JSON.parse(localStorage.getItem('mario_unlocked_skins') || '["default"]');
  let currentSkin = localStorage.getItem('mario_current_skin') || 'default';

  let activeShield = false;
  let activeStar = false;
  let extraTimeAdded = 0;

  let currentDifficulty = '10';
  let currentRound = 1;
  const TOTAL_ROUNDS = 10; // 改為 10 道題
  let lives = 3;
  let bossHp = 3;
  let correctAnswer = 0;
  let isActionLocked = false;
  let comboCount = 0;

  let timeLeft = 8;
  let maxTime = 8;
  let timerInterval = null;

  /* ================= 音訊載入與音效控制 ================= */
  const bgmAudio = new Audio('bgm.mp3');
  bgmAudio.loop = true;
  bgmAudio.volume = 0.55;

  const bossAudio = new Audio('boss.mp3'); // Boss 戰專屬音樂
  bossAudio.loop = true;
  bossAudio.volume = 0.6;

  const gameOverAudio = new Audio('gameover.mp3');
  gameOverAudio.volume = 0.75;

  let actx = null;
  function getAudioContext() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  window.addEventListener('pointerdown', () => { getAudioContext(); }, { once: false });
  window.addEventListener('keydown', () => { getAudioContext(); }, { once: false });

  let isBGMEnabled = true;

  function playTone(freq, type, dur, gainVal = 0.15) {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      g.gain.setValueAtTime(gainVal, ctx.currentTime);
      g.gain.setValueAtTime(gainVal, ctx.currentTime + dur - 0.03); 
      g.gain.linearRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  }

  function sndCoin() {
    playTone(987.77, 'square', 0.1, 0.22);
    setTimeout(() => playTone(1318.51, 'square', 0.35, 0.22), 80);
  }
  function sndJump() {
    [160, 320, 480, 640].forEach((p, idx) => setTimeout(() => playTone(p, 'square', 0.045, 0.14), idx * 22));
  }
  function sndStomp() { playTone(150, 'triangle', 0.2, 0.45); }
  function sndWrong() { playTone(120, 'sawtooth', 0.3, 0.25); }
  function sndPipe() {
    [300, 350, 400, 450].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.08, 0.12), i * 35));
  }
  function sndPowerUp() {
    [330, 392, 659, 523, 587, 784].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.1, 0.18), i * 50));
  }
  function sndGameOver() {
    gameOverAudio.currentTime = 0;
    gameOverAudio.play().catch(e => {
      [493.88, 587.33, 493.88, 440.00, 392.00, 349.23, 329.63].forEach((f, i) => {
        setTimeout(() => playTone(f, 'triangle', 0.2, 0.2), i * 180);
      });
    });
  }

  /* 音樂動態切換：一般關卡播 bgm.mp3，Boss 關卡播 boss.mp3 */
  function updateBGMState() {
    if (!isBGMEnabled) {
      bgmAudio.pause();
      bossAudio.pause();
      return;
    }
    if (currentRound === TOTAL_ROUNDS) {
      bgmAudio.pause();
      bossAudio.play().catch(e => console.log('Boss 音樂待點擊'));
    } else {
      bossAudio.pause();
      bossAudio.currentTime = 0;
      bgmAudio.play().catch(e => console.log('BGM 待點擊'));
    }
  }

  function toggleBGM() {
    isBGMEnabled = !isBGMEnabled;
    const btn = document.getElementById('bgm-toggle-btn');
    if (isBGMEnabled) {
      btn.textContent = '🎵 ON';
      btn.style.background = '#f59e0b';
      updateBGMState();
    } else {
      btn.textContent = '🔇 OFF';
      btn.style.background = '#64748b';
      bgmAudio.pause();
      bossAudio.pause();
    }
  }

  /* ================= 介面與英雄渲染 ================= */
  const appEl = document.getElementById('game-app');
  const qText = document.getElementById('q-text');
  const coinTotalEl = document.getElementById('coin-total');
  const roundCount = document.getElementById('round-count');
  const livesDisplay = document.getElementById('lives-display');
  const modalBox = document.getElementById('modal-box');
  const shopModal = document.getElementById('shop-modal');
  const lbModal = document.getElementById('lb-modal');
  const playerBox = document.getElementById('player-box');
  const enemyBox = document.getElementById('enemy-box');
  const timerBar = document.getElementById('timer-bar');
  const statusIndicator = document.getElementById('status-indicator');
  const bossHpWrap = document.getElementById('boss-hp-wrap');
  const bossHearts = document.getElementById('boss-hearts');

  function renderHero() {
    playerBox.innerHTML = currentSkin === 'alt' ? SVGS.luigi : SVGS.mario;
  }

  function updateStatusBadges() {
    let html = '';
    if (activeShield) html += `<span class="status-badge" style="color:#4ade80;">🍄 護盾保護中</span>`;
    if (activeStar) html += `<span class="status-badge" style="color:#fde047;">⭐ 3倍金幣</span>`;
    if (comboCount > 1) html += `<span class="status-badge" style="color:#f43f5e;">⚡ Combo x${comboCount}</span>`;
    statusIndicator.innerHTML = html;
  }

  /* ================= 計時器管理 ================= */
  function startTimer() {
    clearInterval(timerInterval);
    maxTime = 8 + extraTimeAdded;
    timeLeft = maxTime;
    extraTimeAdded = 0;
    updateTimerUI();

    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleChoice(-1);
      } else {
        updateTimerUI();
      }
    }, 100);
  }

  function updateTimerUI() {
    const pct = Math.max(0, (timeLeft / maxTime) * 100);
    timerBar.style.width = `${pct}%`;
    if (pct > 50) timerBar.style.backgroundColor = '#22c55e';
    else if (pct > 25) timerBar.style.backgroundColor = '#eab308';
    else timerBar.style.backgroundColor = '#ef4444';
  }

  /* ================= 遊戲核心邏輯 ================= */
  function updateCoinUI() {
    coinTotalEl.textContent = `${totalCoins}`;
  }

  function showDifficultyMenu() {
    clearInterval(timerInterval);
    getAudioContext();
    modalBox.style.display = 'flex';
  }

  function startBattle(diff) {
    getAudioContext();

    currentDifficulty = diff;
    currentRound = 1;
    lives = 3;
    bossHp = 3;
    comboCount = 0;
    isActionLocked = false;

    roundCount.textContent = `${currentRound}`;
    updateLivesUI();
    renderHero();

    updateBGMState();

    modalBox.style.display = 'none';
    shopModal.style.display = 'none';
    lbModal.style.display = 'none';
    nextTurn();
  }

  function updateLivesUI() {
    livesDisplay.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
  }

  function updateEnemyVisual() {
    if (currentRound === TOTAL_ROUNDS) {
      appEl.classList.add('boss-theme');
      enemyBox.innerHTML = SVGS.bowser;
      bossHpWrap.style.display = 'flex';
      bossHearts.textContent = '❤️'.repeat(bossHp);
    } else {
      appEl.classList.remove('boss-theme');
      bossHpWrap.style.display = 'none';
      const list = [SVGS.goomba, SVGS.koopa, SVGS.piranha];
      enemyBox.innerHTML = list[(currentRound - 1) % list.length];
    }
  }

  function nextTurn() {
    isActionLocked = false;
    roundCount.textContent = `${currentRound}`;
    updateStatusBadges();
    updateEnemyVisual();
    updateBGMState();

    playerBox.classList.remove('player-stomp-anim');
    playerBox.classList.add('idle-anim');

    enemyBox.classList.remove('enemy-squished', 'idle-anim', 'enemy-emerge-anim');
    setTimeout(() => {
      enemyBox.classList.add('enemy-emerge-anim');
      sndPipe();
    }, 25);
    
    setTimeout(() => {
      if (!enemyBox.classList.contains('enemy-squished')) {
        enemyBox.classList.remove('enemy-emerge-anim');
        enemyBox.classList.add('idle-anim');
      }
    }, 680);

    generateQuestion();
    startTimer();
  }

  function generateQuestion() {
    let a = 0, b = 0, maxRange = 10, isPlus = Math.random() > 0.45;

    if (currentDifficulty === '10') {
      a = isPlus ? Math.floor(Math.random() * 6) : Math.floor(Math.random() * 10) + 1;
      b = isPlus ? Math.floor(Math.random() * (10 - a)) : Math.floor(Math.random() * (a + 1));
      maxRange = 10;
      correctAnswer = isPlus ? a + b : a - b;
      qText.textContent = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;
    } 
    else if (currentDifficulty === '100') {
      a = isPlus ? Math.floor(Math.random() * 50) + 10 : Math.floor(Math.random() * 60) + 20;
      b = isPlus ? Math.floor(Math.random() * (100 - a)) : Math.floor(Math.random() * (a - 5)) + 1;
      maxRange = 100;
      correctAnswer = isPlus ? a + b : a - b;
      qText.textContent = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;
    } 
    else if (currentDifficulty === '1000') {
      a = isPlus ? Math.floor(Math.random() * 450) + 50 : Math.floor(Math.random() * 500) + 200;
      b = isPlus ? Math.floor(Math.random() * (1000 - a)) : Math.floor(Math.random() * (a - 20)) + 10;
      maxRange = 1000;
      correctAnswer = isPlus ? a + b : a - b;
      qText.textContent = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;
    }
    else if (currentDifficulty === 'mul_2_5') {
      a = Math.floor(Math.random() * 4) + 2;
      b = Math.floor(Math.random() * 9) + 1;
      maxRange = 45;
      correctAnswer = a * b;
      qText.textContent = `${a} × ${b} = ?`;
    }
    else if (currentDifficulty === 'mul_5_6') {
      a = Math.floor(Math.random() * 2) + 5;
      b = Math.floor(Math.random() * 9) + 1;
      maxRange = 54;
      correctAnswer = a * b;
      qText.textContent = `${a} × ${b} = ?`;
    }
    else if (currentDifficulty === 'mul_2_9') {
      a = Math.floor(Math.random() * 8) + 2;
      b = Math.floor(Math.random() * 9) + 1;
      maxRange = 81;
      correctAnswer = a * b;
      qText.textContent = `${a} × ${b} = ?`;
    }

    const options = new Set([correctAnswer]);
    while (options.size < 4) {
      let offset = (Math.floor(Math.random() * 7) - 3);
      if (currentDifficulty === '1000') offset *= 10;
      const fake = correctAnswer + (offset === 0 ? 2 : offset);
      if (fake >= 0 && fake <= maxRange) options.add(fake);
      else options.add(Math.floor(Math.random() * maxRange));
    }
    const optionArr = Array.from(options).sort(() => Math.random() - 0.5);

    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`opt-${i}`);
      btn.textContent = optionArr[i];
      btn.dataset.val = optionArr[i];
    }
  }

  function handleChoice(idx) {
    if (isActionLocked) return;
    clearInterval(timerInterval);
    getAudioContext();

    const chosen = idx >= 0 ? parseInt(document.getElementById(`opt-${idx}`).dataset.val, 10) : -999;

    if (chosen === correctAnswer) {
      isActionLocked = true;
      comboCount++;

      const baseRewards = { "10": 5, "100": 15, "1000": 50, "mul_2_5": 10, "mul_5_6": 15, "mul_2_9": 25 };
      let reward = baseRewards[currentDifficulty] || 10;
      
      if (comboCount > 1) reward += (comboCount * 2);
      if (activeStar) {
        reward *= 3;
        activeStar = false;
      }

      totalCoins += reward;
      localStorage.setItem('mario_total_coins', totalCoins);
      updateCoinUI();
      updateStatusBadges();
      
      sndJump();
      playerBox.classList.remove('idle-anim');
      playerBox.classList.add('player-stomp-anim');

      setTimeout(() => {
        sndStomp();
        sndCoin();
        triggerScreenShake();
        
        const spark = document.createElement('div');
        spark.className = 'hit-spark';
        spark.innerHTML = SVGS.spark;
        document.getElementById('battle-stage').appendChild(spark);
        setTimeout(() => spark.remove(), 320);

        if (currentRound === TOTAL_ROUNDS) {
          bossHp--;
          bossHearts.textContent = '❤️'.repeat(Math.max(0, bossHp));
          if (bossHp <= 0) {
            enemyBox.classList.remove('idle-anim', 'enemy-emerge-anim');
            enemyBox.classList.add('enemy-squished');
          }
        } else {
          enemyBox.classList.remove('idle-anim', 'enemy-emerge-anim');
          enemyBox.classList.add('enemy-squished');
        }

        const fx = document.createElement('div');
        fx.className = 'coin-fx';
        fx.textContent = `🪙 +${reward}`;
        fx.style.right = '45px';
        fx.style.bottom = '115px';
        document.getElementById('battle-stage').appendChild(fx);
        setTimeout(() => fx.remove(), 650);
      }, 540);

      setTimeout(() => {
        playerBox.classList.remove('player-stomp-anim');
        playerBox.classList.add('idle-anim');

        if (currentRound === TOTAL_ROUNDS && bossHp > 0) {
          nextTurn();
        } else if (currentRound >= TOTAL_ROUNDS && bossHp <= 0) {
          endBattle(true);
        } else {
          currentRound++;
          nextTurn();
        }
      }, 920);

    } else {
      comboCount = 0;
      updateStatusBadges();

      if (activeShield) {
        activeShield = false;
        updateStatusBadges();
        sndPowerUp();
        qText.textContent = "🛡️ 護盾抵擋！";
        setTimeout(nextTurn, 800);
        return;
      }

      lives--;
      updateLivesUI();
      sndWrong();
      triggerScreenShake();
      
      if (lives <= 0) {
        isActionLocked = true;
        bgmAudio.pause();
        bossAudio.pause();
        setTimeout(() => {
          sndGameOver();
        }, 120);
        endBattle(false);
      } else {
        setTimeout(nextTurn, 800);
      }
    }
  }

  function triggerScreenShake() {
    appEl.classList.remove('screen-shake');
    void appEl.offsetWidth;
    appEl.classList.add('screen-shake');
  }

  /* ================= 商店與造型系統 ================= */
  function openShop() {
    clearInterval(timerInterval);
    document.getElementById('shop-coin-display').textContent = totalCoins;
    const skinBtn = document.getElementById('btn-skin-unlock');
    if (unlockedSkins.includes('alt')) {
      skinBtn.textContent = currentSkin === 'alt' ? "切換瑪利歐" : "切換路易吉";
      skinBtn.disabled = false;
    } else {
      skinBtn.textContent = "解鎖 (100 幣)";
    }
    shopModal.style.display = 'flex';
  }

  function closeShop() {
    shopModal.style.display = 'none';
    if (!isActionLocked) startTimer();
  }

  function buyItem(type, price) {
    if (totalCoins < price) {
      alert("🪙 金幣不夠喔！多答對題目賺取金幣吧！");
      return;
    }
    totalCoins -= price;
    localStorage.setItem('mario_total_coins', totalCoins);
    updateCoinUI();
    document.getElementById('shop-coin-display').textContent = totalCoins;
    sndPowerUp();

    if (type === 'shield') activeShield = true;
    else if (type === 'star') activeStar = true;
    else if (type === 'clock') extraTimeAdded += 5;

    updateStatusBadges();
    alert("🎉 購買成功！道具已生效！");
  }

  function buySkin(price) {
    if (unlockedSkins.includes('alt')) {
      currentSkin = currentSkin === 'alt' ? 'default' : 'alt';
      localStorage.setItem('mario_current_skin', currentSkin);
      renderHero();
      openShop();
      return;
    }
    if (totalCoins < price) {
      alert("🪙 金幣不夠喔！");
      return;
    }
    totalCoins -= price;
    unlockedSkins.push('alt');
    currentSkin = 'alt';
    localStorage.setItem('mario_total_coins', totalCoins);
    localStorage.setItem('mario_unlocked_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('mario_current_skin', currentSkin);
    updateCoinUI();
    renderHero();
    sndPowerUp();
    alert("🎉 恭喜解鎖 路易吉 造型！");
    openShop();
  }

  /* ================= 自動重啟與紀錄系統 ================= */
  function endBattle(isWin) {
    clearInterval(timerInterval);
    isActionLocked = true;
    
    saveScore(totalCoins, currentDifficulty, isWin);

    qText.textContent = isWin ? "🏆 通關成功！" : "💀 再接再厲！";
    for (let i = 0; i < 4; i++) {
      document.getElementById(`opt-${i}`).textContent = "-";
    }

    setTimeout(() => {
      startBattle(currentDifficulty);
    }, 2500);
  }

  function saveScore(coins, mode, isWin) {
    const modeNames = {
      "10": "10加減", "100": "100加減", "1000": "1000加減",
      "mul_2_5": "2-5乘法", "mul_5_6": "5-6乘法", "mul_2_9": "2-9乘法"
    };
    const list = JSON.parse(localStorage.getItem('mario_lb') || '[]');
    list.unshift({
      mode: modeNames[mode] || "冒險",
      coins: coins,
      status: isWin ? "通關 🏆" : "挑戰 💥"
    });
    localStorage.setItem('mario_lb', JSON.stringify(list.slice(0, 10)));
  }

  function openLeaderboard() {
    clearInterval(timerInterval);
    getAudioContext();
    const list = JSON.parse(localStorage.getItem('mario_lb') || '[]');
    const tbody = document.getElementById('lb-body');
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">尚無紀錄</td></tr>';
    } else {
      tbody.innerHTML = list.map((item, idx) => `
        <tr>
          <td style="color:#fde047;">${idx + 1}</td>
          <td>${item.mode || '-'}</td>
          <td>🪙 ${item.coins}</td>
          <td>${item.status || '-'}</td>
        </tr>
      `).join('');
    }
    lbModal.style.display = 'flex';
  }

  function closeLeaderboard() {
    lbModal.style.display = 'none';
    if (!isActionLocked) startTimer();
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === '1') handleChoice(0);
    else if (e.key === '2') handleChoice(1);
    else if (e.key === '3') handleChoice(2);
    else if (e.key === '4') handleChoice(3);
  });

  updateCoinUI();
  renderHero();
  enemyBox.innerHTML = SVGS.goomba;
</script>
</body>
</html>
