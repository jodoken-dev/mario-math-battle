<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍄 瑪利歐加減法大冒險</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: #0f172a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }
  #game-container {
    width: 480px;
    height: 720px;
    border: 4px solid #000;
    box-shadow: 0 10px 0 #000;
    position: relative;
  }
  #leaderboard-modal {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    color: #fff;
  }
  .lb-title { font-size: 18px; color: #fde047; margin-bottom: 16px; text-shadow: 2px 2px #c2410c; }
  .lb-table { width: 100%; font-size: 11px; margin-bottom: 20px; border-collapse: collapse; }
  .lb-table th { color: #38bdf8; padding: 8px 4px; border-bottom: 2px solid #334155; }
  .lb-table td { padding: 8px 4px; text-align: center; border-bottom: 1px solid #1e293b; }
  .lb-btn {
    background: #e52521;
    border: 2px solid #fff;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    padding: 10px 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="leaderboard-modal">
    <div class="lb-title">🏆 冒險排行榜</div>
    <table class="lb-table">
      <thead>
        <tr><th>#</th><th>PLAYER</th><th>COINS</th><th>ROUNDS</th></tr>
      </thead>
      <tbody id="lb-body"></tbody>
    </table>
    <button class="lb-btn" onclick="closeLeaderboard()">關閉</button>
  </div>
</div>

<script>
const LocalGameEngine = {
  generateQuestion(difficulty) {
    const isPlus = Math.random() > 0.45;
    let a = 0, b = 0, maxR = 10;

    if (difficulty === "10") {
      a = isPlus ? Math.floor(Math.random() * 6) : Math.floor(Math.random() * 10) + 1;
      b = isPlus ? Math.floor(Math.random() * (10 - a)) : Math.floor(Math.random() * (a + 1));
      maxR = 10;
    } else if (difficulty === "100") {
      a = isPlus ? Math.floor(Math.random() * 50) + 10 : Math.floor(Math.random() * 60) + 20;
      b = isPlus ? Math.floor(Math.random() * (100 - a)) : Math.floor(Math.random() * (a - 5)) + 1;
      maxR = 100;
    } else {
      a = isPlus ? Math.floor(Math.random() * 450) + 50 : Math.floor(Math.random() * 500) + 200;
      b = isPlus ? Math.floor(Math.random() * (1000 - a)) : Math.floor(Math.random() * (a - 20)) + 10;
      maxR = 1000;
    }

    const ans = isPlus ? a + b : a - b;
    const options = new Set([ans]);
    while (options.size < 4) {
      const offset = (Math.floor(Math.random() * 7) - 3) * (difficulty === "1000" ? 10 : 1);
      const fake = ans + (offset === 0 ? 2 : offset);
      if (fake >= 0 && fake <= maxR) options.add(fake);
      else options.add(Math.floor(Math.random() * maxR));
    }

    return {
      question: `${a} ${isPlus ? '+' : '-'} ${b} = ?`,
      correct_answer: ans,
      options: Array.from(options).sort(() => Math.random() - 0.5)
    };
  },

  verify(userAnswer, correctAnswer, difficulty) {
    const isCorrect = userAnswer === correctAnswer;
    const rewards = { "10": 5, "100": 15, "1000": 50 };
    return {
      is_correct: isCorrect,
      coin_earned: isCorrect ? (rewards[difficulty] || 5) : 0
    };
  },

  saveScore(name, coins, rounds) {
    const list = JSON.parse(localStorage.getItem('local_lb') || '[]');
    list.push({ name, coins, rounds });
    list.sort((a, b) => b.coins - a.coins || b.rounds - a.rounds);
    localStorage.setItem('local_lb', JSON.stringify(list.slice(0, 10)));
  },

  getLeaderboard() {
    return JSON.parse(localStorage.getItem('local_lb') || '[]');
  }
};

class MathBattleScene extends Phaser.Scene {
  constructor() {
    super('MathBattleScene');
  }

  init() {
    this.coins = 0;
    this.round = 1;
    this.lives = 3;
    this.difficulty = '10';
    this.currentData = null;
    this.isActionLocked = false;
    this.playerName = localStorage.getItem('player_name') || 'MarioHero';
  }

  preload() {
    this.createTextureHero();
    this.createTextureEnemy();
    this.createTextureSpark();
  }

  create() {
    const { width, height } = this.scale;

    this.add.rectangle(width / 2, height / 2, width, height, 0x5c94fc);
    
    const hills = this.add.graphics();
    hills.fillStyle(0x00a800, 1);
    hills.fillCircle(80, 480, 120);
    hills.fillCircle(400, 480, 150);
    hills.fillStyle(0x008800, 1);
    hills.fillCircle(240, 490, 80);

    this.add.rectangle(width / 2, 490, width, 60, 0xc84c0c);
    this.add.rectangle(width / 2, 462, width, 4, 0x000000);
    this.add.rectangle(380, 440, 60, 50, 0x00a800).setStrokeStyle(3, 0x000000);
    this.add.rectangle(380, 410, 68, 14, 0x00a800).setStrokeStyle(3, 0x000000);

    this.hero = this.add.sprite(90, 425, 'pixel_hero');
    this.enemy = this.add.sprite(380, 425, 'pixel_enemy');

    this.tweens.add({
      targets: [this.hero, this.enemy],
      y: '-=5',
      duration: 600,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });

    this.coinText = this.add.text(20, 20, `🪙 0`, { font: '14px "Press Start 2P"', fill: '#fff' }).setStroke('#000', 4);
    this.roundText = this.add.text(180, 20, `RD 1/5`, { font: '14px "Press Start 2P"', fill: '#fff' }).setStroke('#000', 4);
    this.livesText = this.add.text(320, 20, `❤️❤️❤️`, { font: '14px sans-serif' });

    const rankBtn = this.add.rectangle(420, 60, 90, 30, 0xf59e0b).setStrokeStyle(2, 0xffffff).setInteractive({ useHandCursor: true });
    this.add.text(420, 60, `🏆 榜`, { font: '11px sans-serif', fill: '#000' }).setOrigin(0.5);
    rankBtn.on('pointerdown', () => openLeaderboard());

    this.qBox = this.add.rectangle(width / 2, 110, 400, 60, 0xfcb040).setStrokeStyle(4, 0x000000);
    this.qText = this.add.text(width / 2, 110, `載入中...`, { font: '20px "Press Start 2P"', fill: '#000' }).setOrigin(0.5);

    this.sparks = this.add.particles(0, 0, 'spark', {
      speed: { min: 100, max: 250 },
      scale: { start: 1.5, end: 0 },
      lifespan: 350,
      emitting: false
    });

    this.optionButtons = [];
    this.optionTexts = [];
    const btnPositions = [
      { x: 130, y: 560 }, { x: 350, y: 560 },
      { x: 130, y: 640 }, { x: 350, y: 640 }
    ];

    btnPositions.forEach((pos, idx) => {
      const btn = this.add.rectangle(pos.x, pos.y, 200, 64, 0xe52521).setStrokeStyle(4, 0xffffff).setInteractive({ useHandCursor: true });
      const txt = this.add.text(pos.x, pos.y, `-`, { font: '24px "Press Start 2P"', fill: '#ffffff' }).setOrigin(0.5);
      btn.on('pointerdown', () => this.handleAnswer(idx));
      btn.on('pointerover', () => btn.setFillStyle(0xff4444));
      btn.on('pointerout', () => btn.setFillStyle(0xe52521));
      this.optionButtons.push(btn);
      this.optionTexts.push(txt);
    });

    this.fetchNextQuestion();
  }

  fetchNextQuestion() {
    this.currentData = LocalGameEngine.generateQuestion(this.difficulty);
    this.qText.setText(this.currentData.question);
    this.currentData.options.forEach((opt, i) => {
      this.optionTexts[i].setText(opt);
      this.optionButtons[i].setData('value', opt);
    });
    this.isActionLocked = false;
  }

  handleAnswer(index) {
    if (this.isActionLocked) return;
    this.isActionLocked = true;

    const chosen = this.optionButtons[index].getData('value');
    const result = LocalGameEngine.verify(chosen, this.currentData.correct_answer, this.difficulty);

    if (result.is_correct) {
      this.playAttackSequence(result.coin_earned);
    } else {
      this.playHurtSequence();
    }
  }

  playAttackSequence(earned) {
    this.coins += earned;
    this.coinText.setText(`🪙 ${this.coins}`);

    this.tweens.add({
      targets: this.hero,
      x: 380,
      y: 270,
      angle: -10,
      duration: 320,
      ease: 'Quad.easeOut',
      onComplete: () => {
        this.tweens.add({
          targets: this.hero,
          y: 425,
          angle: 0,
          duration: 180,
          ease: 'Quad.easeIn',
          onComplete: () => {
            this.cameras.main.shake(200, 0.015);
            this.sparks.emitParticleAt(380, 430, 20);

            this.tweens.add({
              targets: this.enemy,
              scaleY: 0.2, scaleX: 2.2, duration: 120, yoyo: true
            });

            this.tweens.add({
              targets: this.hero,
              x: 90, y: 425, duration: 380, delay: 150,
              onComplete: () => {
                this.round++;
                if (this.round > 5) {
                  this.qText.setText("🏆 STAGE CLEAR!");
                  this.submitScoreAndShowBoard();
                } else {
                  this.roundText.setText(`RD ${this.round}/5`);
                  this.fetchNextQuestion();
                }
              }
            });
          }
        });
      }
    });
  }

  playHurtSequence() {
    this.lives--;
    this.livesText.setText('❤️'.repeat(Math.max(0, this.lives)) + '🖤'.repeat(Math.max(0, 3 - this.lives)));
    this.cameras.main.shake(250, 0.02);
    this.hero.setTint(0xff0000);
    this.time.delayedCall(300, () => {
      this.hero.clearTint();
      if (this.lives <= 0) {
        this.qText.setText("💀 GAME OVER");
        this.submitScoreAndShowBoard();
      } else {
        this.isActionLocked = false;
      }
    });
  }

  submitScoreAndShowBoard() {
    const name = prompt("請輸入你的名字紀錄成績：", this.playerName) || "MarioHero";
    this.playerName = name;
    localStorage.setItem('player_name', name);
    LocalGameEngine.saveScore(name, this.coins, this.round - 1);
    openLeaderboard();
  }

  createTextureHero() {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xe52521, 1);
    g.fillRect(16, 0, 32, 16);
    g.fillRect(8, 12, 44, 8);
    g.fillStyle(0xfed7aa, 1);
    g.fillRect(16, 20, 28, 20);
    g.fillRect(40, 24, 12, 12);
    g.fillStyle(0x451a03, 1);
    g.fillRect(28, 32, 24, 8);
    g.fillStyle(0x0284c7, 1);
    g.fillRect(16, 40, 32, 24);
    g.fillStyle(0xfde047, 1);
    g.fillRect(20, 44, 6, 6);
    g.fillRect(38, 44, 6, 6);
    g.fillStyle(0x78350f, 1);
    g.fillRect(12, 64, 16, 8);
    g.fillRect(36, 64, 16, 8);
    g.generateTexture('pixel_hero', 64, 72);
  }

  createTextureEnemy() {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0x9a3412, 1);
    g.fillRect(16, 0, 32, 12);
    g.fillRect(8, 12, 48, 24);
    g.fillStyle(0xfed7aa, 1);
    g.fillRect(16, 36, 32, 16);
    g.fillStyle(0x000000, 1);
    g.fillRect(20, 36, 6, 12);
    g.fillRect(38, 36, 6, 12);
    g.fillStyle(0x000000, 1);
    g.fillRect(8, 52, 18, 10);
    g.fillRect(38, 52, 18, 10);
    g.generateTexture('pixel_enemy', 64, 64);
  }

  createTextureSpark() {
    const g = this.make.graphics({ x: 0, y: 0, add: false });
    g.fillStyle(0xfde047, 1);
    g.fillRect(3, 0, 4, 10);
    g.fillRect(0, 3, 10, 4);
    g.generateTexture('spark', 10, 10);
  }
}

function openLeaderboard() {
  const modal = document.getElementById('leaderboard-modal');
  const tbody = document.getElementById('lb-body');
  modal.style.display = 'flex';
  const data = LocalGameEngine.getLeaderboard();
  
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4">尚無紀錄</td></tr>';
  } else {
    tbody.innerHTML = data.map((item, idx) => `
      <tr>
        <td style="color:#fde047;">${idx + 1}</td>
        <td>${item.name}</td>
        <td>🪙 ${item.coins}</td>
        <td>${item.rounds}</td>
      </tr>
    `).join('');
  }
}

function closeLeaderboard() {
  document.getElementById('leaderboard-modal').style.display = 'none';
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: 480,
  height: 720,
  pixelArt: true,
  scene: [MathBattleScene]
};
new Phaser.Game(config);
</script>
</body>
</html>
