<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍄 數學大冒險 & 決鬥</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
    touch-action: manipulation;
  }
  body {
    background: #0f172a;
    color: #ffffff;
    font-family: 'Press Start 2P', monospace, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #game-app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 800px;
    position: relative;
    display: flex;
    flex-direction: column;
    border: 6px solid #000000;
    box-shadow: 0 10px 0 #000000;
    overflow: hidden;
    transition: background 0.3s;
  }

  .theme-mario #game-app { background: #5c94fc; }
  .theme-yugi #game-app { background: radial-gradient(circle at center, #3b0764 0%, #090514 100%); }

  .screen-shake {
    animation: shakeEffect 0.22s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shakeEffect {
    10%, 90% { transform: translate3d(-3px, 2px, 0); }
    20%, 80% { transform: translate3d(4px, -3px, 0); }
    30%, 50%, 70% { transform: translate3d(-5px, 4px, 0); }
    40%, 60% { transform: translate3d(5px, -4px, 0); }
  }

  #header {
    background: rgba(0, 0, 0, 0.8);
    padding: 10px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: #ffffff;
    text-shadow: 2px 2px #000000;
    z-index: 30;
    border-bottom: 3px solid #000;
  }

  .btn-top {
    background: #f59e0b;
    border: 2px solid #ffffff;
    color: #000;
    font-family: inherit;
    font-size: 9px;
    font-weight: bold;
    padding: 4px 5px;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-top:active { transform: translateY(2px); }

  #battle-stage {
    flex: 1;
    position: relative;
    width: 100%;
    overflow: hidden;
  }

  .clouds-layer {
    position: absolute;
    top: 15px;
    left: 0;
    width: 200%;
    height: 45px;
    background: radial-gradient(circle 14px at 20px 20px, #ffffff 100%, transparent 0),
                radial-gradient(circle 20px at 45px 16px, #ffffff 100%, transparent 0),
                radial-gradient(circle 14px at 70px 20px, #ffffff 100%, transparent 0);
    background-size: 240px 45px;
    opacity: 0.85;
    animation: cloudMove 25s linear infinite;
    z-index: 1;
  }
  @keyframes cloudMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .hills-layer {
    position: absolute;
    bottom: 38px;
    width: 100%;
    height: 100px;
    z-index: 2;
    pointer-events: none;
  }

  .theme-yugi .yugi-bg-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 300px;
    height: 300px;
    transform: translate(-50%, -50%);
    border: 3px dashed #d97706;
    border-radius: 50%;
    box-shadow: 0 0 25px #b45309, inset 0 0 25px #b45309;
    opacity: 0.4;
    animation: rotateMagic 20s linear infinite;
    z-index: 1;
  }
  @keyframes rotateMagic {
    0% { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(360deg); }
  }

  .question-block {
    position: absolute;
    top: 12px;
    left: 5%;
    width: 90%;
    border-radius: 10px;
    text-align: center;
    padding: 12px 10px;
    animation: floatBlock 2.2s infinite ease-in-out;
    z-index: 25;
  }
  .theme-mario .question-block {
    background: #fcb040;
    border: 4px solid #000000;
    box-shadow: inset -4px -4px 0 #8c4000, inset 4px 4px 0 #ffe0a0, 0 5px 0 rgba(0,0,0,0.4);
  }
  .theme-yugi .question-block {
    background: #1e1b4b;
    border: 3px solid #f59e0b;
    box-shadow: 0 0 15px #f59e0b, inset 0 0 10px #6366f1;
  }

  @keyframes floatBlock {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  .q-math {
    font-size: 22px;
    letter-spacing: 2px;
    font-weight: 900;
  }
  .theme-mario .q-math { color: #000000; }
  .theme-yugi .q-math { color: #fde047; text-shadow: 0 0 8px #f59e0b; }

  /* 地面與水管 */
  .ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 38px;
    border-top: 4px solid #000;
    z-index: 10;
  }
  .theme-mario .ground {
    background: repeating-linear-gradient(45deg, #c84c0c, #c84c0c 12px, #000 12px, #000 14px, #fc9838 14px, #fc9838 24px);
  }
  .theme-yugi .ground {
    background: linear-gradient(to top, #0f172a, #312e81);
    border-top: 3px solid #6366f1;
    box-shadow: 0 0 15px #6366f1;
  }

  .pipe {
    position: absolute;
    right: 28px;
    bottom: 38px;
    width: 86px;
    height: 60px;
    z-index: 9;
  }
  .theme-mario .pipe {
    background: #00a800;
    border: 4px solid #000;
    box-shadow: inset 6px 0 0 #54f054, inset -6px 0 0 #005400;
  }
  .theme-mario .pipe::before {
    content: '';
    position: absolute;
    top: -16px;
    left: -5px;
    width: 88px;
    height: 16px;
    background: #00a800;
    border: 4px solid #000;
    box-shadow: inset 6px 0 0 #54f054, inset -6px 0 0 #005400;
  }
  .theme-yugi .pipe {
    background: #1e1b4b;
    border: 3px solid #eab308;
    box-shadow: 0 0 10px #eab308;
    border-radius: 6px;
  }
  .theme-yugi .pipe::before {
    content: 'SUMMON';
    position: absolute;
    top: -16px;
    left: -3px;
    width: 86px;
    height: 16px;
    background: #eab308;
    color: #000;
    font-size: 8px;
    line-height: 16px;
    text-align: center;
    font-weight: bold;
  }

  /* 角色與怪物精準座標 */
  #player-box {
    position: absolute;
    left: 28px;
    bottom: 38px;
    width: 76px;
    height: 90px;
    z-index: 15;
    transform-origin: bottom center;
  }

  #enemy-box {
    position: absolute;
    right: 37px;
    bottom: 98px; /* 精準置於水管口上方 */
    width: 68px;
    height: 68px;
    z-index: 8;
    transform-origin: bottom center;
  }

  /* 瑪利歐輕微呼吸感（不浮空） */
  .idle-anim {
    animation: idleBreathe 1.1s infinite ease-in-out alternate;
  }
  @keyframes idleBreathe {
    0% { transform: scale(1, 1); }
    100% { transform: scale(1.02, 0.96); }
  }

  /* 香菇從水管深處由下往上升起 */
  .enemy-emerge-anim {
    animation: pipeEmerge 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.15) forwards;
  }
  @keyframes pipeEmerge {
    0% { transform: translateY(65px); opacity: 0; }
    25% { opacity: 1; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* 瑪利歐擬真打擊拋物線：起跳 -> 俯衝踩怪 -> 頓點反彈 -> 後翻落地 */
  .player-stomp-anim {
    animation: dynamicJumpStomp 0.88s cubic-bezier(0.22, 0.61, 0.36, 1) forwards !important;
  }
  @keyframes dynamicJumpStomp {
    0% {
      transform: translate3d(0, 0, 0) scale(1, 1);
    }
    15% {
      transform: translate3d(0, 8px, 0) scale(1.1, 0.85); /* 起跳蓄力壓身 */
    }
    45% {
      transform: translate3d(140px, -145px, 0) rotate(-12deg) scale(0.95, 1.08); /* 拋物線頂點 */
    }
    62% {
      transform: translate3d(245px, -60px, 0) rotate(0deg) scale(1.15, 0.8); /* 踩中怪獸壓扁 */
    }
    72% {
      transform: translate3d(225px, -110px, 0) rotate(15deg) scale(0.95, 1.05); /* 踩怪彈跳升空 */
    }
    90% {
      transform: translate3d(40px, -20px, 0) rotate(5deg) scale(1, 1);
    }
    97% {
      transform: translate3d(0, 4px, 0) scale(1.08, 0.92); /* 落地緩衝 */
    }
    100% {
      transform: translate3d(0, 0, 0) scale(1, 1); /* 恢復原位 */
    }
  }

  /* 香菇被踩扁：變半扁、抖動、沉入水管 */
  .enemy-squished {
    animation: squishAnim 0.45s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
  }
  @keyframes squishAnim {
    0% { transform: scale(1, 1) translateY(0); }
    30% { transform: scale(1.4, 0.18) translateY(20px); opacity: 1; }
    60% { transform: scale(1.5, 0.1) translateY(35px); opacity: 0.8; }
    100% { transform: scale(1.5, 0.05) translateY(65px); opacity: 0; }
  }

  .hit-spark {
    position: absolute;
    right: 42px;
    bottom: 105px;
    width: 65px;
    height: 65px;
    pointer-events: none;
    z-index: 28;
    animation: hitPop 0.32s ease-out forwards;
  }
  @keyframes hitPop {
    0% { transform: scale(0.2) rotate(0deg); opacity: 1; }
    100% { transform: scale(1.4) rotate(45deg); opacity: 0; }
  }

  #options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px 14px 18px;
    background: #000000;
    width: 100%;
    border-top: 4px solid #ffffff;
    z-index: 20;
  }

  .btn-option {
    border: 4px solid #ffffff;
    font-family: inherit;
    font-size: 24px;
    font-weight: 900;
    padding: 15px 0;
    border-radius: 10px;
    cursor: pointer;
    text-align: center;
  }
  .theme-mario .btn-option {
    background: #e52521;
    box-shadow: inset -4px -4px 0 #800000, inset 4px 4px 0 #ff9999, 0 4px 0 #000;
    color: #ffffff;
  }
  .theme-yugi .btn-option {
    background: #1e1b4b;
    border-color: #f59e0b;
    box-shadow: inset 0 0 10px #4338ca, 0 4px 0 #000;
    color: #fde047;
  }
  .btn-option:active { transform: translateY(3px); box-shadow: none; }

  .coin-fx {
    position: absolute;
    font-size: 22px;
    color: #ffd700;
    text-shadow: 2px 2px #000;
    font-weight: 900;
    pointer-events: none;
    z-index: 30;
    animation: coinPop 0.65s ease-out forwards;
  }
  @keyframes coinPop {
    0% { transform: translate3d(0, 0, 0) scale(0.6); opacity: 1; }
    100% { transform: translate3d(0, -50px, 0) scale(1.25); opacity: 0; }
  }

  .modal-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.96);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 16px 20px;
    z-index: 50;
    text-align: center;
  }
  .modal-title { font-size: 16px; color: #fde047; margin-bottom: 10px; text-shadow: 2px 2px #c2410c; }
  .modal-desc { font-size: 11px; color: #94a3b8; margin-bottom: 12px; font-family: sans-serif; font-weight: bold; }

  .mode-group-title {
    width: 100%;
    font-size: 11px;
    color: #38bdf8;
    text-align: left;
    margin: 6px 0 4px;
    font-family: sans-serif;
    font-weight: bold;
  }

  .mode-btn {
    width: 100%;
    background: #0284c7;
    border: 2px solid #ffffff;
    box-shadow: inset -2px -2px 0 #0369a1, inset 2px 2px 0 #38bdf8, 0 3px 0 #000;
    color: #ffffff;
    font-family: inherit;
    font-size: 11px;
    font-weight: 900;
    padding: 9px 6px;
    border-radius: 8px;
    margin-bottom: 6px;
    cursor: pointer;
    text-align: center;
  }
  .mode-btn:active { transform: translateY(2px); box-shadow: none; }
  .mode-btn.mul {
    background: #059669;
    box-shadow: inset -2px -2px 0 #047857, inset 2px 2px 0 #34d399, 0 3px 0 #000;
  }

  .lb-table { width: 100%; font-size: 11px; margin-bottom: 16px; border-collapse: collapse; }
  .lb-table th { color: #38bdf8; padding: 6px 4px; border-bottom: 2px solid #334155; }
  .lb-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #1e293b; }
</style>
</head>
<body class="theme-mario">

<div id="game-app">
  <div id="header">
    <div>🪙 <span id="coin-total">0</span></div>
    <div>RD <span id="round-count">1</span>/5</div>
    <div><span id="lives-display">❤️❤️❤️</span></div>
    <button class="btn-top" id="theme-btn" onclick="toggleTheme()">🎨 換皮</button>
    <button class="btn-top" id="bgm-toggle-btn" onclick="toggleBGM()">🎵 ON</button>
    <button class="btn-top" onclick="showDifficultyMenu()">⚙️ 難度</button>
    <button class="btn-top" onclick="openLeaderboard()">🏆 榜</button>
  </div>

  <div id="battle-stage">
    <div class="clouds-layer"></div>
    <div class="yugi-bg-circle"></div>
    <div class="hills-layer">
      <svg width="100%" height="100%" viewBox="0 0 400 100" preserveAspectRatio="none">
        <ellipse cx="60" cy="100" rx="90" ry="60" fill="#008800" stroke="#000" stroke-width="3"/>
        <ellipse cx="280" cy="100" rx="120" ry="70" fill="#00a800" stroke="#000" stroke-width="3"/>
        <ellipse cx="160" cy="100" rx="35" ry="25" fill="#54f054" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="370" cy="100" rx="40" ry="28" fill="#54f054" stroke="#000" stroke-width="2.5"/>
      </svg>
    </div>

    <div class="question-block">
      <div class="q-math" id="q-text">-- + --</div>
    </div>

    <div class="sprite-box idle-anim" id="player-box"></div>
    <div class="sprite-box" id="enemy-box"></div>

    <div class="pipe"></div>
    <div class="ground"></div>
  </div>

  <div id="options-grid">
    <button class="btn-option" onclick="handleChoice(0)" id="opt-0">-</button>
    <button class="btn-option" onclick="handleChoice(1)" id="opt-1">-</button>
    <button class="btn-option" onclick="handleChoice(2)" id="opt-2">-</button>
    <button class="btn-option" onclick="handleChoice(3)" id="opt-3">-</button>
  </div>

  <div id="modal-box" class="modal-screen">
    <h1 class="modal-title" id="menu-title">SUPER MARIO<br>MATH BATTLE</h1>
    <p class="modal-desc">請選擇訓練等級：</p>
    
    <div class="mode-group-title">➕ ➖ 加減法冒險</div>
    <button class="mode-btn" onclick="startBattle('10')">🍄 10 以內加減法</button>
    <button class="mode-btn" onclick="startBattle('100')">⭐ 100 以內加減法</button>
    <button class="mode-btn" onclick="startBattle('1000')">👑 1000 以內直式挑戰</button>
    
    <div class="mode-group-title">✖️ 九九乘法表冒險</div>
    <button class="mode-btn mul" onclick="startBattle('mul_2_5')">🌸 2 ~ 5 乘法表</button>
    <button class="mode-btn mul" onclick="startBattle('mul_5_6')">⚡ 5 ~ 6 乘法表</button>
    <button class="mode-btn mul" onclick="startBattle('mul_2_9')">🔥 2 ~ 9 乘法全階段</button>
  </div>

  <div id="lb-modal" class="modal-screen" style="display:none;">
    <h1 class="modal-title">🏆 TOP 10 冒險英雄榜</h1>
    <table class="lb-table">
      <thead><tr><th>#</th><th>玩家</th><th>金幣</th><th>模式</th></tr></thead>
      <tbody id="lb-body"></tbody>
    </table>
    <button class="mode-btn" style="background:#dc2626;" onclick="closeLeaderboard()">關閉</button>
  </div>
</div>

<script>
  const SVGS = {
    mario: `
      <svg viewBox="0 0 100 120" width="76" height="90">
        <ellipse cx="50" cy="22" rx="32" ry="16" fill="#e52521" stroke="#000" stroke-width="3"/>
        <path d="M 18 28 Q 50 14 82 28 Q 50 38 18 28" fill="#e52521" stroke="#000" stroke-width="3"/>
        <ellipse cx="50" cy="18" rx="9" ry="7" fill="#ffffff" stroke="#000" stroke-width="2"/>
        <circle cx="22" cy="48" r="7" fill="#fed7aa" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="50" cy="50" rx="26" ry="20" fill="#fed7aa" stroke="#000" stroke-width="3"/>
        <ellipse cx="60" cy="42" rx="4.5" ry="8" fill="#000"/>
        <ellipse cx="66" cy="48" rx="12" ry="9" fill="#fed7aa" stroke="#000" stroke-width="3"/>
        <path d="M 32 54 C 42 46 64 48 76 56 C 68 64 46 63 32 54 Z" fill="#451a03" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="50" cy="84" rx="24" ry="20" fill="#e52521" stroke="#000" stroke-width="3"/>
        <path d="M 30 78 L 70 78 L 66 106 L 34 106 Z" fill="#0284c7" stroke="#000" stroke-width="3"/>
        <circle cx="38" cy="84" r="4.5" fill="#facc15" stroke="#000" stroke-width="2"/>
        <circle cx="62" cy="84" r="4.5" fill="#facc15" stroke="#000" stroke-width="2"/>
        <ellipse cx="36" cy="110" rx="14" ry="8" fill="#78350f" stroke="#000" stroke-width="3"/>
        <ellipse cx="64" cy="110" rx="14" ry="8" fill="#78350f" stroke="#000" stroke-width="3"/>
      </svg>
    `,
    goomba: `
      <svg viewBox="0 0 100 100" width="68" height="68">
        <path d="M 50 15 C 20 15 12 55 22 68 C 30 78 70 78 78 68 C 88 55 80 15 50 15" fill="#9a3412" stroke="#000" stroke-width="3"/>
        <ellipse cx="38" cy="46" rx="5" ry="10" fill="#fff" stroke="#000" stroke-width="2"/>
        <ellipse cx="62" cy="46" rx="5" ry="10" fill="#fff" stroke="#000" stroke-width="2"/>
        <circle cx="40" cy="48" r="3" fill="#000"/>
        <circle cx="60" cy="48" r="3" fill="#000"/>
        <path d="M 32 34 L 46 40 M 68 34 L 54 40" stroke="#000" stroke-width="3.5" stroke-linecap="round"/>
        <polygon points="34,68 38,60 42,68" fill="#fff"/>
        <polygon points="58,68 62,60 66,68" fill="#fff"/>
        <ellipse cx="32" cy="80" rx="14" ry="8" fill="#000"/>
        <ellipse cx="68" cy="80" rx="14" ry="8" fill="#000"/>
      </svg>
    `,
    yugi: `
      <svg viewBox="0 0 100 120" width="76" height="92">
        <polygon points="50,5 30,30 50,22 70,30" fill="#facc15" stroke="#000" stroke-width="2"/>
        <polygon points="20,15 10,45 30,38" fill="#dc2626" stroke="#000" stroke-width="2"/>
        <polygon points="80,15 90,45 70,38" fill="#dc2626" stroke="#000" stroke-width="2"/>
        <polygon points="50,15 25,40 50,30 75,40" fill="#facc15" stroke="#000" stroke-width="2"/>
        <ellipse cx="50" cy="55" rx="20" ry="18" fill="#fed7aa" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="42" cy="54" rx="4" ry="6" fill="#9333ea" stroke="#000" stroke-width="1.5"/>
        <ellipse cx="58" cy="54" rx="4" ry="6" fill="#9333ea" stroke="#000" stroke-width="1.5"/>
        <path d="M 28 72 L 72 72 L 68 110 L 32 110 Z" fill="#1e1b4b" stroke="#000" stroke-width="3"/>
        <polygon points="50,78 40,95 60,95" fill="#facc15" stroke="#000" stroke-width="2"/>
        <circle cx="50" cy="88" r="2.5" fill="#000"/>
      </svg>
    `,
    kuriboh: `
      <svg viewBox="0 0 100 100" width="68" height="68">
        <circle cx="50" cy="50" r="35" fill="#78350f" stroke="#000" stroke-width="3"/>
        <ellipse cx="50" cy="20" rx="10" ry="8" fill="#78350f"/>
        <ellipse cx="25" cy="30" rx="8" ry="10" fill="#78350f"/>
        <ellipse cx="75" cy="30" rx="8" ry="10" fill="#78350f"/>
        <ellipse cx="38" cy="48" rx="8" ry="12" fill="#22c55e" stroke="#000" stroke-width="2"/>
        <ellipse cx="62" cy="48" rx="8" ry="12" fill="#22c55e" stroke="#000" stroke-width="2"/>
        <circle cx="39" cy="46" r="3" fill="#fff"/>
        <circle cx="63" cy="46" r="3" fill="#fff"/>
        <ellipse cx="35" cy="80" rx="8" ry="5" fill="#ca8a04" stroke="#000" stroke-width="2"/>
        <ellipse cx="65" cy="80" rx="8" ry="5" fill="#ca8a04" stroke="#000" stroke-width="2"/>
      </svg>
    `,
    spark: `
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <polygon points="50,0 60,35 95,50 60,65 50,100 40,65 5,50 40,35" fill="#fde047" stroke="#ffffff" stroke-width="4"/>
      </svg>
    `
  };

  let currentTheme = 'mario';

  function toggleTheme() {
    currentTheme = currentTheme === 'mario' ? 'yugi' : 'mario';
    document.body.className = `theme-${currentTheme}`;
    const btn = document.getElementById('theme-btn');
    const title = document.getElementById('menu-title');
    
    if (currentTheme === 'mario') {
      btn.textContent = '🎨 瑪利歐';
      title.innerHTML = 'SUPER MARIO<br>MATH BATTLE';
      playerBox.innerHTML = SVGS.mario;
      enemyBox.innerHTML = SVGS.goomba;
    } else {
      btn.textContent = '🎨 遊戲王';
      title.innerHTML = 'YU-GI-OH!<br>MATH DUEL';
      playerBox.innerHTML = SVGS.yugi;
      enemyBox.innerHTML = SVGS.kuriboh;
    }
  }

  /* ================= 音訊載入與音效控制 ================= */
  const bgmAudio = new Audio('bgm.mp3');
  bgmAudio.loop = true;
  bgmAudio.volume = 0.55;

  const gameOverAudio = new Audio('gameover.mp3');
  gameOverAudio.volume = 0.75;

  let actx = null;
  function getAudioContext() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }

  window.addEventListener('pointerdown', () => { getAudioContext(); }, { once: false });
  window.addEventListener('keydown', () => { getAudioContext(); }, { once: false });

  let isBGMEnabled = true;

  function playTone(freq, type, dur, gainVal = 0.15) {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      g.gain.setValueAtTime(gainVal, ctx.currentTime);
      g.gain.setValueAtTime(gainVal, ctx.currentTime + dur - 0.03); 
      g.gain.linearRampToValueAtTime(0.001, ctx.currentTime + dur);
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    } catch(e) {}
  }

  function sndCoin() {
    playTone(987.77, 'square', 0.1, 0.22);
    setTimeout(() => playTone(1318.51, 'square', 0.35, 0.22), 80);
  }
  function sndJump() {
    [160, 320, 480, 640].forEach((p, idx) => setTimeout(() => playTone(p, 'square', 0.045, 0.14), idx * 22));
  }
  function sndStomp() { playTone(150, 'triangle', 0.2, 0.45); }
  function sndWrong() { playTone(120, 'sawtooth', 0.3, 0.25); }
  function sndPipe() {
    [300, 350, 400, 450].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.08, 0.12), i * 35));
  }

  function sndGameOver() {
    gameOverAudio.currentTime = 0;
    gameOverAudio.play().catch(e => {
      // 降級純音效
      [493.88, 587.33, 493.88, 440.00, 392.00, 349.23, 329.63].forEach((f, i) => {
        setTimeout(() => playTone(f, 'triangle', 0.2, 0.2), i * 180);
      });
    });
  }

  function startBGM() {
    if (isBGMEnabled) {
      bgmAudio.currentTime = 0;
      bgmAudio.play().catch(e => console.log('等待互動'));
    }
  }

  function toggleBGM() {
    isBGMEnabled = !isBGMEnabled;
    const btn = document.getElementById('bgm-toggle-btn');
    if (isBGMEnabled) {
      btn.textContent = '🎵 ON';
      btn.style.background = '#f59e0b';
      bgmAudio.play();
    } else {
      btn.textContent = '🔇 OFF';
      btn.style.background = '#64748b';
      bgmAudio.pause();
    }
  }

  /* ================= 遊戲核心邏輯 ================= */
  let totalCoins = parseInt(localStorage.getItem('mario_total_coins') || '0', 10);
  let currentDifficulty = '10';
  let currentRound = 1;
  let earnedCoinsThisRound = 0;
  let lives = 3;
  let correctAnswer = 0;
  let isActionLocked = false;

  const appEl = document.getElementById('game-app');
  const qText = document.getElementById('q-text');
  const coinTotalEl = document.getElementById('coin-total');
  const roundCount = document.getElementById('round-count');
  const livesDisplay = document.getElementById('lives-display');
  const modalBox = document.getElementById('modal-box');
  const lbModal = document.getElementById('lb-modal');
  const playerBox = document.getElementById('player-box');
  const enemyBox = document.getElementById('enemy-box');

  function updateCoinUI() {
    coinTotalEl.textContent = `${totalCoins}`;
  }

  function showDifficultyMenu() {
    getAudioContext();
    modalBox.style.display = 'flex';
  }

  function startBattle(diff) {
    getAudioContext();
    startBGM();

    currentDifficulty = diff;
    currentRound = 1;
    earnedCoinsThisRound = 0;
    lives = 3;
    isActionLocked = false;

    roundCount.textContent = `${currentRound}`;
    updateLivesUI();
    playerBox.innerHTML = currentTheme === 'mario' ? SVGS.mario : SVGS.yugi;
    enemyBox.innerHTML = currentTheme === 'mario' ? SVGS.goomba : SVGS.kuriboh;

    modalBox.style.display = 'none';
    lbModal.style.display = 'none';
    nextTurn();
  }

  function updateLivesUI() {
    livesDisplay.textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives));
  }

  function nextTurn() {
    isActionLocked = false;
    roundCount.textContent = `${currentRound}`;
    
    playerBox.classList.remove('player-stomp-anim');
    playerBox.classList.add('idle-anim');

    enemyBox.classList.remove('enemy-squished', 'idle-anim', 'enemy-emerge-anim');
    setTimeout(() => {
      enemyBox.classList.add('enemy-emerge-anim');
      sndPipe();
    }, 25);
    
    setTimeout(() => {
      if (!enemyBox.classList.contains('enemy-squished')) {
        enemyBox.classList.remove('enemy-emerge-anim');
        enemyBox.classList.add('idle-anim');
      }
    }, 680);

    let a = 0, b = 0, maxRange = 10;

    if (currentDifficulty === '10') {
      const isPlus = Math.random() > 0.45;
      a = isPlus ? Math.floor(Math.random() * 6) : Math.floor(Math.random() * 10) + 1;
      b = isPlus ? Math.floor(Math.random() * (10 - a)) : Math.floor(Math.random() * (a + 1));
      maxRange = 10;
      correctAnswer = isPlus ? a + b : a - b;
      qText.textContent = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;
    } 
    else if (currentDifficulty === '100') {
      const isPlus = Math.random() > 0.45;
      a = isPlus ? Math.floor(Math.random() * 50) + 10 : Math.floor(Math.random() * 60) + 20;
      b = isPlus ? Math.floor(Math.random() * (100 - a)) : Math.floor(Math.random() * (a - 5)) + 1;
      maxRange = 100;
      correctAnswer = isPlus ? a + b : a - b;
      qText.textContent = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;
    } 
    else if (currentDifficulty === '1000') {
      const isPlus = Math.random() > 0.45;
      a = isPlus ? Math.floor(Math.random() * 450) + 50 : Math.floor(Math.random() * 500) + 200;
      b = isPlus ? Math.floor(Math.random() * (1000 - a)) : Math.floor(Math.random() * (a - 20)) + 10;
      maxRange = 1000;
      correctAnswer = isPlus ? a + b : a - b;
      qText.textContent = `${a} ${isPlus ? '+' : '-'} ${b} = ?`;
    }
    else if (currentDifficulty === 'mul_2_5') {
      a = Math.floor(Math.random() * 4) + 2;
      b = Math.floor(Math.random() * 9) + 1;
      maxRange = 45;
      correctAnswer = a * b;
      qText.textContent = `${a} × ${b} = ?`;
    }
    else if (currentDifficulty === 'mul_5_6') {
      a = Math.floor(Math.random() * 2) + 5;
      b = Math.floor(Math.random() * 9) + 1;
      maxRange = 54;
      correctAnswer = a * b;
      qText.textContent = `${a} × ${b} = ?`;
    }
    else if (currentDifficulty === 'mul_2_9') {
      a = Math.floor(Math.random() * 8) + 2;
      b = Math.floor(Math.random() * 9) + 1;
      maxRange = 81;
      correctAnswer = a * b;
      qText.textContent = `${a} × ${b} = ?`;
    }

    const options = new Set([correctAnswer]);
    while (options.size < 4) {
      let offset = 0;
      if (currentDifficulty === '1000') {
        offset = (Math.floor(Math.random() * 7) - 3) * 10;
      } else if (currentDifficulty.startsWith('mul_')) {
        offset = (Math.floor(Math.random() * 7) - 3) * (Math.random() > 0.5 ? a : 1);
      } else {
        offset = (Math.floor(Math.random() * 7) - 3);
      }
      
      const fake = correctAnswer + (offset === 0 ? 2 : offset);
      if (fake >= 0 && fake <= maxRange) options.add(fake);
      else options.add(Math.floor(Math.random() * maxRange));
    }
    const optionArr = Array.from(options).sort(() => Math.random() - 0.5);

    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`opt-${i}`);
      btn.textContent = optionArr[i];
      btn.dataset.val = optionArr[i];
    }
  }

  function handleChoice(idx) {
    if (isActionLocked) return;
    getAudioContext();
    const chosen = parseInt(document.getElementById(`opt-${idx}`).dataset.val, 10);

    if (chosen === correctAnswer) {
      isActionLocked = true;
      const rewards = {
        "10": 5, "100": 15, "1000": 50,
        "mul_2_5": 10, "mul_5_6": 15, "mul_2_9": 25
      };
      const reward = rewards[currentDifficulty] || 10;

      earnedCoinsThisRound += reward;
      totalCoins += reward;
      localStorage.setItem('mario_total_coins', totalCoins);
      updateCoinUI();
      
      sndJump();
      playerBox.classList.remove('idle-anim');
      playerBox.classList.add('player-stomp-anim');

      // 踩中打擊反饋（配合 0.55s 踩怪時刻）
      setTimeout(() => {
        sndStomp();
        sndCoin();
        triggerScreenShake();
        
        const spark = document.createElement('div');
        spark.className = 'hit-spark';
        spark.innerHTML = SVGS.spark;
        document.getElementById('battle-stage').appendChild(spark);
        setTimeout(() => spark.remove(), 320);

        enemyBox.classList.remove('idle-anim', 'enemy-emerge-anim');
        enemyBox.classList.add('enemy-squished');

        const fx = document.createElement('div');
        fx.className = 'coin-fx';
        fx.textContent = `🪙 +${reward}`;
        fx.style.right = '45px';
        fx.style.bottom = '115px';
        document.getElementById('battle-stage').appendChild(fx);
        setTimeout(() => fx.remove(), 650);
      }, 540);

      // 完全著地後再進行換題或結算
      setTimeout(() => {
        playerBox.classList.remove('player-stomp-anim');
        playerBox.classList.add('idle-anim');

        if (currentRound >= 5) {
          endBattle(true);
        } else {
          currentRound++;
          nextTurn();
        }
      }, 920);

    } else {
      lives--;
      updateLivesUI();
      sndWrong();
      triggerScreenShake();
      
      if (lives <= 0) {
        isActionLocked = true;
        bgmAudio.pause();
        setTimeout(() => {
          sndGameOver();
        }, 120);
        setTimeout(() => endBattle(false), 2400);
      }
    }
  }

  function triggerScreenShake() {
    appEl.classList.remove('screen-shake');
    void appEl.offsetWidth;
    appEl.classList.add('screen-shake');
  }

  function endBattle(isWin) {
    const name = prompt(isWin ? "🎉 恭喜通關！請輸入名字紀錄戰績：" : "💀 遊戲結束！請輸入名字：", "冒險高手") || "英雄";
    saveScore(name, totalCoins, currentDifficulty);
    openLeaderboard();
  }

  function saveScore(name, coins, mode) {
    const modeNames = {
      "10": "10加減", "100": "100加減", "1000": "1000加減",
      "mul_2_5": "2-5乘法", "mul_5_6": "5-6乘法", "mul_2_9": "2-9乘法"
    };
    const list = JSON.parse(localStorage.getItem('mario_lb') || '[]');
    list.push({ name, coins, mode: modeNames[mode] || "冒險" });
    list.sort((a, b) => b.coins - a.coins);
    localStorage.setItem('mario_lb', JSON.stringify(list.slice(0, 10)));
  }

  function openLeaderboard() {
    getAudioContext();
    const list = JSON.parse(localStorage.getItem('mario_lb') || '[]');
    const tbody = document.getElementById('lb-body');
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">尚無紀錄</td></tr>';
    } else {
      tbody.innerHTML = list.map((item, idx) => `
        <tr>
          <td style="color:#fde047;">${idx + 1}</td>
          <td>${item.name}</td>
          <td>🪙 ${item.coins}</td>
          <td>${item.mode || '-'}</td>
        </tr>
      `).join('');
    }
    lbModal.style.display = 'flex';
  }

  function closeLeaderboard() {
    lbModal.style.display = 'none';
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === '1') handleChoice(0);
    else if (e.key === '2') handleChoice(1);
    else if (e.key === '3') handleChoice(2);
    else if (e.key === '4') handleChoice(3);
  });

  updateCoinUI();
  playerBox.innerHTML = SVGS.mario;
  enemyBox.innerHTML = SVGS.goomba;
</script>
</body>
</html>
